version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      # Types must match the Node.js version of the functions runtime (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
